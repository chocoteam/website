# Builds the website and publishes it to chocoteam/chocoteam.github.io (https://choco-solver.org), as deploy.sh does.
#
# Triggered:
# - by choco-solver when a release tag is pushed (its workflow website.yml sends the repository_dispatch
#   'choco-solver-release' with the tag);
# - by hand, with a tag (vX.Y.Z) or, for an urgent fix between two releases, a commit of choco-solver.
#
# The documentation comes from choco-solver (Hugo module github.com/chocoteam/choco-solver): the version is pinned
# in go.mod (`hugo mod get`), choco_version in config.toml is set for a tag, and both are committed on the branch.
#
# Requirements:
# - secret PAGES_TOKEN: token allowed to push to chocoteam/chocoteam.github.io (contents: write).

name: Deploy

on:
  repository_dispatch:
    types: [ choco-solver-release ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag (vX.Y.Z) or commit of choco-solver whose documentation is published'
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  HUGO_VERSION: 0.160.1
  VERSION: ${{ github.event.client_payload.tag || inputs.version }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "${VERSION}" =~ ^[0-9a-f]{7,40}$ ]] \
            || { echo "::error::'${VERSION}' is neither a tag vX.Y.Z nor a commit"; exit 1; }

      # Full history: enableGitInfo gives the last modification date of the pages
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: chocoteam/chocoteam.github.io
          path: public
          token: ${{ secrets.PAGES_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Pin the documentation of choco-solver
        run: |
          hugo mod get "github.com/chocoteam/choco-solver@${VERSION}"
          if [[ "${VERSION}" == v* ]]; then
            sed -i -E "s/^([[:space:]]*choco_version = )\"[^\"]*\"/\1\"${VERSION#v}\"/" config.toml
          fi
          git diff -- go.mod go.sum config.toml

      - name: Build
        run: |
          npm ci
          find public -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          hugo --config config.toml
          hugo --config config-reveal.toml

      - name: Publish
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The site did not change"
          else
            git commit -q -m "rebuilding site for choco-solver ${VERSION}"
            git push origin HEAD:master
          fi

      - name: Commit the pinned version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum config.toml
          if git diff --cached --quiet; then
            echo "The pinned version did not change"
          else
            git commit -q -m "Publish the documentation of choco-solver ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
